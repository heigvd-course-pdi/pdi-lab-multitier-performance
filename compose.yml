services:

  # ----------------------------------------------------------------------------
  # API Service
  # ----------------------------------------------------------------------------
  api:
    build: ./api
    environment:
      - COMPUTE_URL=http://compute/airquality
    ports:
      - "8080:80" # Expose on port 8080 to avoid permission problems
    depends_on:
      - compute
    deploy:
      resources:
        limits:
          cpus: '0.5'
  
  compute:
    build: ./compute
    environment:
      - EXTERNAL_MAP_API_URL=http://external_maps/airquality
      - EXTERNAL_MAP_API_HOST=external_maps
      - DATABASE_URL=http://db/airquality
    depends_on:
      - db
      - external_maps
    deploy:
      resources:
        limits:
          cpus: '0.5'

  db:
    build: ./db
    deploy:
      resources:
        limits:
          cpus: '0.5'
  
  external_maps:
    build: ./maps
    deploy:
      resources:
        limits:
          cpus: '0.5'
